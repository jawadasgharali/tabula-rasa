<!DOCTYPE html>
<html data-html lang="en">
<head>
	<meta charset="utf-8" />
	<title>menuitem_data</title>
	<style></style>
	<link href="../../styles/tabula_rasa.css" rel="stylesheet" />
	<script></script>
</head>
<body data-body>
	<menu type="context" id="myMenu">
		<menuitem data-menuitem label="Refresh" onclick="alert('Refreshed!')">
		<menuitem data-menuitem label="Save" onclick="alert('Saved!')">
	</menu>
	<p>Right-click anywhere to see the custom menu item.</p>
	<script>
		document.body.setAttribute('contextmenu', 'myMenu');
	</script>
</body>
</html>
